[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "followup-companion"
version = "0.1.0"
requires-python = ">=3.10"
description = "CALL-E based follow-up AI agent for chronic/post-op patients"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = [
    "arbitration/tests", "triage/tests", "memory/tests",
    "agents/tests", "eval/tests",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
